<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ALABASTER — a city in white</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A cinematic monochrome low-poly city. Scroll to descend from the clouds to the sidewalk.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><rect x='18' y='34' width='16' height='48' fill='%23555b62'/><rect x='42' y='16' width='18' height='66' fill='%23343a41'/><rect x='66' y='44' width='14' height='38' fill='%23555b62'/></svg>">
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #ffffff; }
  body { background: #ffffff; overflow-x: hidden; }
  #spacer { height: 760vh; height: 760svh; width: 100%; pointer-events: none; }
  #stage { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 58%, rgba(48,52,58,0.12) 100%);
  }
  #track { position: fixed; top: 0; right: 0; width: 2px; height: 100%; background: rgba(120,126,132,.14); z-index: 5; pointer-events: none; }
  #trackFill { position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: rgba(90,96,102,.5); }
  #intro { position: fixed; inset: 0; z-index: 9; background: #ffffff; pointer-events: none; transition: opacity 1.3s ease; }
  #fail {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: #fff; color: #55595e; font-family: system-ui, sans-serif;
    font-size: 14px; line-height: 1.6; padding: 20vh 12vw; text-align: center;
  }
  #debug {
    position: fixed; left: 14px; bottom: 14px; z-index: 6;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #6b7076;
    background: rgba(255,255,255,.72); padding: 6px 8px; border-radius: 4px;
    white-space: pre; display: none; pointer-events: none;
  }
</style>
</head>
<body>

<div id="spacer"></div>
<div id="stage"></div>
<div id="vignette"></div>
<div id="track"><div id="trackFill"></div></div>
<div id="debug"></div>
<div id="fail">This experience needs WebGL.<br>Please try a current browser, or a device with hardware acceleration enabled.</div>
<div id="intro"></div>

<script type="module">
/* ================================================================== *
 *  ALABASTER — a monochrome low-poly city, from the clouds to the    *
 *  sidewalk. Everything procedural: no models, no textures fetched.  *
 * ================================================================== */

let THREE;
try {
  THREE = await import('./three.module.min.js');          // vendored (fast, offline-safe)
} catch (e1) {
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.min.js');
  } catch (e2) {
    THREE = await import('https://unpkg.com/three@0.185.0/build/three.module.min.js');
  }
}

const qs = new URLSearchParams(location.search);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- device tier ---------------- */
function detectTier() {
  const ua = navigator.userAgent;
  const uaMobile = navigator.userAgentData?.mobile ?? /Android|iPhone|iPod|Mobile/i.test(ua);
  const isTabletUA = /iPad|Tablet|Silk/i.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const coarse = matchMedia('(pointer: coarse)').matches;
  const mem = navigator.deviceMemory ?? 8;
  const cores = navigator.hardwareConcurrency ?? 8;
  const shortSide = Math.min(screen.width, screen.height);
  if (navigator.connection?.saveData) return 'mobile';
  if (uaMobile && !isTabletUA) return 'mobile';
  if (isTabletUA || (coarse && shortSide >= 700)) return 'tablet';
  if (mem <= 4 || cores <= 4) return 'tablet';
  return 'desktop';
}
const tier = ['desktop', 'tablet', 'mobile'].includes(qs.get('quality')) ? qs.get('quality') : detectTier();
const MOBILE = tier === 'mobile';

const PRESETS = {
  desktop: { dpr: 2,   shadows: true,  shadowMap: 2048, groundTex: 2048, mist: 3,
             people: 165, cars: 34, parked: 52, birds: 48, planes: 3, clouds: 18, dogs: 6, cloudShadows: true },
  tablet:  { dpr: 1.5, shadows: true,  shadowMap: 1024, groundTex: 2048, mist: 3,
             people: 120, cars: 26, parked: 40, birds: 34, planes: 3, clouds: 14, dogs: 4, cloudShadows: false },
  mobile:  { dpr: 1,   shadows: false, shadowMap: 512,  groundTex: 1024, mist: 2,
             people: 88,  cars: 20, parked: 28, birds: 24, planes: 2, clouds: 10, dogs: 3, cloudShadows: false },
};
const P = PRESETS[tier];

/* ---------------- tiny utils ---------------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20250817);
const rr = (a, b) => a + R() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (p, a, b) => { const t = clamp((p - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const dampf = (c, t, l, dt) => THREE.MathUtils.damp(c, t, l, dt);

/* Merge a list of non-indexed geometries carrying position/normal/color. */
function mergeGeoms(list) {
  let vc = 0; for (const g of list) vc += g.attributes.position.count;
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), col = new Float32Array(vc * 3);
  let o = 0;
  for (const g of list) {
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    col.set(g.attributes.color.array, o * 3);
    o += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return out;
}
/* Transform + tint one primitive into merge-ready form. Scale, then rotate, then move. */
function part(geom, gray, o = {}) {
  const g = geom.toNonIndexed(); if (g !== geom) geom.dispose();
  g.deleteAttribute('uv');
  if (o.sx !== undefined || o.sy !== undefined || o.sz !== undefined)
    g.scale(o.sx ?? 1, o.sy ?? 1, o.sz ?? 1);
  if (o.rz) g.rotateZ(o.rz);
  if (o.rx) g.rotateX(o.rx);
  if (o.ry) g.rotateY(o.ry);
  if (o.x || o.y || o.z) g.translate(o.x ?? 0, o.y ?? 0, o.z ?? 0);
  const n = g.attributes.position.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { col[i * 3] = gray; col[i * 3 + 1] = gray; col[i * 3 + 2] = gray; }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Sph = (r, w = 10, h = 8, a, b, c, d) => new THREE.SphereGeometry(r, w, h, a, b, c, d);
const Cyl = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
const Cap = (r, l, s = 8) => new THREE.CapsuleGeometry(r, l, 3, s);
const Ico = (r, d = 1) => new THREE.IcosahedronGeometry(r, d);
function flatNI(g) { const n = g.toNonIndexed(); if (n !== g) g.dispose(); n.deleteAttribute('uv'); n.computeVertexNormals(); return n; }

/* ---------------- renderer / scene ---------------- */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.debug.checkShaderErrors = false;
} catch (e) {
  document.getElementById('fail').style.display = 'block';
  document.getElementById('intro').style.display = 'none';
  throw e;
}
const BASE_DPR = Math.min(devicePixelRatio || 1, P.dpr);
renderer.setPixelRatio(BASE_DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
if (P.shadows) {
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
}
stage.appendChild(renderer.domElement);

const WHITE = new THREE.Color(0xffffff);
const scene = new THREE.Scene();
scene.background = WHITE;
scene.fog = new THREE.Fog(WHITE, 640, 2150);

const camera = new THREE.PerspectiveCamera(37, innerWidth / innerHeight, 4, 2800);

/* ---------------- lights ---------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0xd0d4da, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
const sunDir = new THREE.Vector3(-0.52, 0.95, 0.34).normalize();   // lights the facades the finale faces
scene.add(sun); scene.add(sun.target);
if (P.shadows) {
  sun.castShadow = true;
  sun.shadow.mapSize.set(P.shadowMap, P.shadowMap);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.6;
  sun.shadow.radius = 2;
  sun.shadow.camera.near = 100;
  sun.shadow.camera.far = 2600;
}
const fill = new THREE.DirectionalLight(0xf4f6fa, 0.4);
fill.position.set(500, 420, -700);
scene.add(fill);

/* ================================================================== *
 *  ISLAND + STREET GRID                                              *
 * ================================================================== */
const AV_PITCH = 54, AV_HALF = 8;
const ST_PITCH = 40, ST_HALF = 4.5;
const SIDE_AV = 5, SIDE_ST = 3.6;
const bend = z => 18 * Math.sin(z * 0.0035);
function halfWidth(z) {
  const t = Math.abs(z / 585); if (t >= 1) return 0;
  const base = 252 * Math.pow(1 - Math.pow(t, 2.6), 1 / 2.6);
  return base * (1 + 0.10 * Math.sin(z * 0.011 + 1.7) + 0.07 * Math.sin(z * 0.023 + 4.2) + 0.05 * Math.sin(z * 0.005 + 0.6));
}
const inside = (x, z) => Math.abs(x - bend(z)) < halfWidth(z);
const edgeDist = (x, z) => halfWidth(z) - Math.abs(x - bend(z));

const HERO_ST = 38;
const STOP_LINE = 29.6;
const XWALK_Z = 31.7;
/* Landing: mobile keeps the down-the-avenue view from the east sidewalk;
   desktop/tablet settle on the median mid-block, turned to face the east
   sidewalk so pedestrians pass laterally through a full storefront scene. */
const LAND = MOBILE ? new THREE.Vector3(12.3, 1.74, 23) : new THREE.Vector3(-10.5, 1.68, 52);

/* keep the camera's descent corridor clear */
function corridorClamp(x, z, h) {
  if (x > 20 && x < 225 && z > -265 && z < -20) h = Math.min(h, 60 + (x - 20) * 0.9);
  if (Math.abs(x) < 52 && z > -85 && z < 6) h = Math.min(h, 50);
  return h;
}

/* ================================================================== *
 *  DISTRICTS — a patchwork of rotated street grids, like a real      *
 *  metro (Chicago/NYC/London): each district owns its own grid       *
 *  angle and block pitch. The hero district stays axis-aligned so    *
 *  the camera choreography and street simulation hold.               *
 * ================================================================== */
const districts = [
  { ox: 0, oz: 55, w: 172, h: 336, th: 0, avP: 54, stP: 40, avH: 8, stH: 4.5, gx: 0, gz: -2, hero: true },
  { ox: 10, oz: 352, w: 440, h: 310, th: 0.24, avP: 48, stP: 36, avH: 7, stH: 4.2 },
  { ox: -18, oz: -310, w: 480, h: 410, th: -0.38, avP: 58, stP: 42, avH: 8, stH: 4.5 },
  { ox: -168, oz: 58, w: 240, h: 380, th: 0.14, avP: 44, stP: 30, avH: 6.5, stH: 4 },
  { ox: 170, oz: 42, w: 240, h: 400, th: -0.2, avP: 46, stP: 34, avH: 6.5, stH: 4 },
  { ox: -32, oz: 522, w: 340, h: 240, th: 0.5, avP: 42, stP: 32, avH: 6, stH: 4 },
  { ox: 30, oz: -520, w: 400, h: 290, th: -0.6, avP: 40, stP: 30, avH: 6, stH: 4 },
];
for (const d of districts) {
  d.cos = Math.cos(d.th); d.sin = Math.sin(d.th);
  if (d.gx === undefined) { d.gx = d.ox; d.gz = d.oz; }
}
const dWorld = (d, lx, lz) => [d.gx + lx * d.cos - lz * d.sin, d.gz + lx * d.sin + lz * d.cos];
function inRect(d, wx, wz) {
  const dx = wx - d.ox, dz = wz - d.oz;
  const lx = dx * d.cos + dz * d.sin, lz = -dx * d.sin + dz * d.cos;
  return Math.abs(lx) < d.w / 2 && Math.abs(lz) < d.h / 2;
}
const claim = (wx, wz) => districts.find(d => inRect(d, wx, wz)) || null;

/* ================================================================== *
 *  CITY MASSING — five instanced unit shapes, one windowed material  *
 *  g: 0 box · 1 tapered crown · 2 pyramid roof · 3 gable roof ·      *
 *     4 faceted round tower                                          *
 * ================================================================== */
const inst = [];
const roofSpots = [];
let curD = districts[0];
function setD(d) { curD = d; }
function addShape(g, lx, y, lz, sx, sy, sz, c, win, ry = 0, rx = 0, rz = 0) {
  inst.push({
    g, x: curD.gx + lx * curD.cos - lz * curD.sin, y, z: curD.gz + lx * curD.sin + lz * curD.cos,
    sx, sy, sz, ry: ry - curD.th, rx, rz, c, win, wph: curPhase,
  });
}
const addBox = (x, y, z, sx, sy, sz, c, ry = 0, rx = 0, rz = 0) => addShape(0, x, y, z, sx, sy, sz, c, c, ry, rx, rz);

/* discrete wall-value steps (spatially varied dark-on-white fabric), one uniform
   dark window family, light trim — the architecture-diagram value plan */
const WALL_STEPS = [0.4, 0.5, 0.6, 0.7];
function facadeTint() {
  if (R() < 0.055) return rr(0.28, 0.34);                  // rare near-dark anchors
  return WALL_STEPS[(R() * 4) | 0] + rr(-0.025, 0.025);
}
const winToneFor = c => clamp(rr(0.2, 0.28), 0.05, Math.max(0.06, c - 0.15));
let curPhase = 0;                                          // per-building window phase

function cornice(bx, y, bz, w, d, c) { addBox(bx, y - 0.45, bz, w + 0.55, 0.5, d + 0.55, Math.min(0.92, c * 1.3 + 0.1)); }
const wOf = (lx, lz) => [curD.gx + lx * curD.cos - lz * curD.sin, curD.gz + lx * curD.sin + lz * curD.cos];
const terraceSpots = [];

/* ---- rooftop kit: the NYC/Chicago roofscape ---- */
function parapet(bx, y, bz, w, d, c) {
  const pc = Math.min(0.9, c * 1.08);
  addBox(bx - w / 2 + 0.15, y, bz, 0.3, 0.5, d, pc);
  addBox(bx + w / 2 - 0.15, y, bz, 0.3, 0.5, d, pc);
  addBox(bx, y, bz - d / 2 + 0.15, w - 0.6, 0.5, 0.3, pc);
  addBox(bx, y, bz + d / 2 - 0.15, w - 0.6, 0.5, 0.3, pc);
}
function roofKit(bx, y, bz, w, d, c, industrial) {
  const area = w * d;
  if (area > 40) parapet(bx, y, bz, w, d, c);
  if (industrial) {
    if (R() < 0.55) {                                        // sawtooth skylights
      const n = Math.max(2, Math.min(4, (d / 2.4) | 0));
      for (let i = 0; i < n; i++)
        addShape(3, bx, y, bz - d / 2 + (i + 0.7) * (d / (n + 0.4)), 1.3, rr(0.7, 1.1), Math.min(3.2, w * 0.5), c * 0.9, c * 0.9, Math.PI / 2);
    }
    for (let i = 0, n = 1 + (R() * 2 | 0); i < n; i++)
      addShape(4, bx + rr(-0.32, 0.32) * w, y, bz + rr(-0.32, 0.32) * d, rr(0.16, 0.3), rr(0.7, 1.4), rr(0.16, 0.3), c * 0.8, c * 0.8);
    return;
  }
  if (area > 55 && R() < 0.55)                               // stair bulkhead
    addBox(bx + (R() < 0.5 ? -1 : 1) * (w / 2 - 2.2), y, bz + rr(-0.3, 0.3) * Math.max(0, d - 4), rr(2.2, 3.2), rr(2.2, 2.9), rr(1.8, 2.6), c * 0.95);
  if (area > 70 && R() < 0.4) {                              // wooden water tank
    const [wx, wz] = wOf(bx + rr(-0.25, 0.25) * w, bz + rr(-0.25, 0.25) * d);
    roofSpots.push([wx, y, wz]);
  }
  const rb = R();
  if (area > 90 && rb < 0.12) {                              // blank rooftop billboard
    const alongX = w >= d;
    const pw = Math.min(7, (alongX ? w : d) * 0.62);
    const eSign = R() < 0.5 ? 1 : -1;
    if (alongX) {
      const ez = bz + eSign * (d / 2 - 0.9);
      for (const s of [-1, 1]) addBox(bx + s * pw * 0.36, y, ez, 0.22, 1.7, 0.22, 0.3);
      addBox(bx, y + 1.55, ez, pw, 2.7, 0.24, 0.32);
      addBox(bx, y + 1.7, ez + eSign * 0.16, pw * 0.93, 2.25, 0.08, 0.94);
    } else {
      const ex = bx + eSign * (w / 2 - 0.9);
      for (const s of [-1, 1]) addBox(ex, y, bz + s * pw * 0.36, 0.22, 1.7, 0.22, 0.3);
      addBox(ex, y + 1.55, bz, 0.24, 2.7, pw, 0.32);
      addBox(ex + eSign * 0.16, y + 1.7, bz, 0.08, 2.25, pw * 0.93, 0.94);
    }
  } else if (area > 70 && rb < 0.22) {                       // roof terrace: planters + umbrella
    addBox(bx - w * 0.2, y, bz + d * 0.2, 1.4, 0.5, 0.55, 0.52);
    addBox(bx + w * 0.24, y, bz - d * 0.16, 0.55, 0.5, 1.4, 0.52);
    const ux = bx + rr(-0.15, 0.15) * w, uz = bz + rr(-0.15, 0.15) * d;
    addBox(ux, y, uz, 0.09, 1.9, 0.09, 0.25);
    addShape(2, ux, y + 1.8, uz, 1.9, 0.6, 1.9, 0.93, 0.93);
    const [wx, wz] = wOf(bx, bz);
    terraceSpots.push([wx, y, wz]);
  }
  for (let i = 0, n = 1 + (R() * 3 | 0); i < n; i++)         // vent pipes
    addShape(4, bx + rr(-0.33, 0.33) * w, y, bz + rr(-0.33, 0.33) * d, rr(0.15, 0.28), rr(0.7, 1.8), rr(0.15, 0.28), c * 0.8, c * 0.8);
  if (area > 60 && R() < 0.4)                                // HVAC drum
    addShape(4, bx + rr(-0.25, 0.25) * w, y, bz + rr(-0.25, 0.25) * d, rr(0.75, 1.2), rr(0.8, 1.3), rr(0.75, 1.2), c * 0.85, c * 0.85);
  if (R() < 0.06) {                                          // flagpole
    const fh = rr(5, 7.5);
    addBox(bx, y, bz, 0.09, fh, 0.09, 0.4);
    addBox(bx + 0.7, y + fh - 0.55, bz, 1.3, 0.6, 0.05, 0.18);
  }
}

/* One building: podium/tower massing, varied roofs, cornices, fins. */
function addBuilding(bx, bz, w, d, h, opts = {}) {
  curPhase = R();
  const c = opts.c ?? facadeTint();
  const win = winToneFor(c);
  const dress = opts.dress ?? (Math.abs(bx) < 46 && bz > -70 && bz < 220);
  const pl = Math.max(0.06, c * 0.62);
  addShape(0, bx, 0, bz, w * 1.05, 0.45, d * 1.05, pl, pl);   // contact-AO plinth
  if (h < 7) {                                              // dockland slab
    addShape(0, bx, 0, bz, w, h, d, c, win);
    if (R() < 0.45) {
      addShape(3, bx, h, bz, w * 0.9, h * 0.6, d * 0.9, c * 0.94, c * 0.94, R() < 0.5 ? 0 : Math.PI / 2);
      if (R() < 0.4) addBox(bx + rr(-0.3, 0.3) * w, h, bz + rr(-0.3, 0.3) * d, 0.5, h * 0.6 + rr(0.5, 1), 0.5, c * 0.85);
    } else {
      cornice(bx, h, bz, w * 0.98, d * 0.98, c);
      roofKit(bx, h, bz, w, d, c, true);
    }
    return;
  }
  if (h < 32) {                                             // low fabric
    addShape(0, bx, 0, bz, w, h, d, c, win);
    const r = R();
    if (r < 0.4) {                                          // gable roof + chimney
      const rx2 = w >= d, rh = rr(2.5, 4.5);
      addShape(3, bx, h, bz, rx2 ? d * 0.98 : w * 0.98, rh, rx2 ? w * 0.98 : d * 0.98, c * 0.9, c * 0.9, rx2 ? Math.PI / 2 : 0);
      if (R() < 0.7) {
        const along = rr(-0.3, 0.3);
        const cxq = bx + (rx2 ? along * w : rr(-0.12, 0.12) * w);
        const czq = bz + (rx2 ? rr(-0.12, 0.12) * d : along * d);
        const ch = rh + rr(0.5, 1.1);
        addBox(cxq, h, czq, 0.55, ch, 0.55, c * 0.85);
        addBox(cxq, h + ch, czq, 0.8, 0.14, 0.8, c * 0.95);
      }
    } else if (r < 0.58) addShape(2, bx, h, bz, w * 0.92, rr(2.5, 5), d * 0.92, c * 0.88, c * 0.88);
    else if (r < 0.72) addShape(1, bx, h, bz, w * 0.95, rr(2, 3.5), d * 0.95, c, win);
    else {
      cornice(bx, h, bz, w, d, c);
      roofKit(bx, h, bz, w, d, c, false);
    }
  } else if (h < 85) {                                      // mid-rise: base + setback
    const baseH = h * rr(0.55, 0.72);
    addShape(0, bx, 0, bz, w, baseH, d, c, win);
    cornice(bx, baseH, bz, w, d, c);
    const s1 = rr(0.68, 0.82);
    addShape(0, bx, baseH, bz, w * s1, h - baseH, d * s1, c, win);
    const r = R();

const clock = new THREE.Clock();

const camPos = new THREE.Vector3(), lookPos = new THREE.Vector3();

function lightState(t) {

}
function walkWindow(t) { const ph = t % CYCLE; return ph > YELLOW_END + 0.8 && ph < CYCLE - 0.9; }

function placePerson(w, mesh, x, y, z, ry, bob, sway, scale) {
  D3.position.set(x, y + bob, z);

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  simT += dt;
  frame++;

  const step = dampf(prog, target, LAMBDA, dt) - prog;
  prog = clamp(prog + clamp(step, -MAX_RATE * dt, MAX_RATE * dt), 0, 1);
  const p = lerp(prog, sstep(prog, 0, 1), 0.55);

  /* ---- camera ---- */
  camPath.getPoint(p, camPos);
  lookPath.getPoint(p, lookPos);
  const idleAmp = reduceMotion ? 0 : lerp(2.4, 0.05, sstep(p, 0, 0.3));
  const drift = reduceMotion ? 0 : (1 - sstep(p, 0, 0.13)) * 24;
  camPos.x += Math.sin(t * 0.19 + 1.3) * idleAmp + Math.sin(t * 0.045) * drift;
  camPos.y += Math.sin(t * 0.23) * idleAmp * 0.5;
  camPos.z += Math.cos(t * 0.16) * idleAmp * 0.8 + Math.cos(t * 0.05) * drift * 0.7;
  lookPos.x += Math.sin(t * 0.11) * idleAmp * 0.45;
  lookPos.y += Math.cos(t * 0.13) * idleAmp * 0.3;
  if (!MOBILE && !reduceMotion) {                      // slow lateral dolly in the finale
    const dolly = Math.sin(t * 0.07) * 1.7 * sstep(p, 0.9, 1);
    camPos.z += dolly; lookPos.z += dolly;             // both, so the 90° framing holds
  }
  camera.position.copy(camPos);
  camera.lookAt(lookPos);
  if (!reduceMotion) camera.rotateZ(rollAt(p));
  /* lens: long aerial → widen through the canyon → narrow planimetric finale */
  camera.fov = 34 + (58 - 34) * sstep(p, 0.45, 0.78) - (58 - (MOBILE ? 54 : 27)) * sstep(p, 0.84, 0.985);
  camera.near = lerp(3.5, 0.16, sstep(p, 0.55, 0.92));
  camera.far = lerp(2800, 950, sstep(p, 0.55, 0.92));
  camera.updateProjectionMatrix();

  if (!introDone) { introT += dt; if (introT > 1.8) introDone = true; }
  const iF = introDone ? 1 : lerp(0.7, 1, sstep(introT, 0.15, 1.8));
  scene.fog.near = lerp(640, 50, sstep(p, 0.1, 0.85)) * iF;
  scene.fog.far = lerp(2150, 430, sstep(p, 0.1, 0.85)) * lerp(0.8, 1, iF);

  if (P.shadows) {
    if (P.cloudShadows) { const on = p < 0.55; cloudMeshes.forEach(m => { m.castShadow = on; }); }
    const f = sstep(p, 0.35, 0.9);
    const half = lerp(800, 85, f);
    const cx = lerp(0, 6, f), cz = lerp(-40, 65, f);
    sun.position.set(cx + sunDir.x * 1150, sunDir.y * 1150, cz + sunDir.z * 1150);
    sun.target.position.set(cx, 0, cz);
    Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half });
    sun.shadow.camera.updateProjectionMatrix();
  }

  /* ---- traffic light ---- */
  const ls = lightState(simT);
  goDot.material.color.setScalar(ls === 'green' ? 0.96 : 0.28);
  stopDot.material.color.setScalar(ls === 'green' ? 0.17 : ls === 'yellow' ? 0.6 : 0.93);

  /* ---- vehicles ---- */
  for (const c of cars) {
    let vdes = c.cruise;
    if (c.hero && c.dir > 0) {
      const z = c.ln.oz + c.ln.dz * c.s;
      if (ls !== 'green') {
        const d = STOP_LINE - 2.4 - z;
        if (d > 0 && d < 42) vdes = Math.min(vdes, d * 0.55);
        else if (d <= 0 && d > -4.8 && c.vel < 1.5) vdes = 0;
      }
      const gap = (c.ahead.s - c.s + 1300) % 1300 - carLen[c.ahead.v] * 0.5 - carLen[c.v] * 0.5;
      if (gap < 26) vdes = Math.min(vdes, Math.max(0, (gap - 3.4) * 0.9));
    }
    c.vel = dampf(c.vel, vdes, 3.2, dt);
    c.s += c.dir * c.vel * dt;
    if (c.s > c.ln.smax) c.s = c.ln.smin; else if (c.s < c.ln.smin) c.s = c.ln.smax;
    D3.position.set(c.ln.ox + c.ln.dx * c.s + c.ln.px * c.off, 0, c.ln.oz + c.ln.dz * c.s + c.ln.pz * c.off);
    D3.rotation.set(0, Math.atan2(c.ln.dx, c.ln.dz) + (c.dir > 0 ? 0 : Math.PI), 0);
    D3.scale.setScalar(1);
    D3.updateMatrix();
    vehicleMeshes[c.v].setMatrixAt(c.slot, D3.matrix);
  }
  vehicleMeshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });

  /* ---- people (skip most frames while high above) ---- */
  const peopleActive = p > 0.16 || frame % 6 === 0;
  if (peopleActive) {
    for (const w of walkers) {
      const wob = Math.sin(t * (4.4 + w.s) + w.ph);
      const wob2 = Math.sin(t * (2.2 + w.s * 0.5) + w.ph);      // stride roll at half the step beat
      const bob = w.idle ? Math.abs(Math.sin(t * 1.7 + w.ph)) * 0.02 : Math.abs(wob) * 0.045 * w.s;
      const sway = reduceMotion ? 0 : wob2 * (w.idle ? 0.012 : 0.07);
      if (!w.idle) {
        if (w.axis === 'z') {
          w.z += w.dir * w.s * dt;
          if (w.z > 200) w.z = -58; else if (w.z < -58) w.z = 200;
          /* flow around the resting camera (either tier's landing sidewalk) */
          if (MOBILE) {
            const dx = w.x - LAND.x;
            if (Math.abs(dx) < 1.6 && Math.abs(w.x) > 8.4 && Math.sign(w.x) === Math.sign(LAND.x)) {
              const push = 1 - sstep(Math.abs(w.z - LAND.z), 1.6, 4.4);
              if (push > 0) {
                const want = (dx >= 0 ? 1.6 - dx : -1.6 - dx) * push;
                w.xOff = Math.abs(want) > Math.abs(w.xOff || 0) ? want : w.xOff;
              }
            }
          } else if (w.x < -8.4) {
            /* desktop finale: west-sidewalk walkers slip behind the camera, against the wall */
            const push = 1 - sstep(Math.abs(w.z - LAND.z), 3.5, 7.5);
            if (push > 0) {
              const want = Math.min(0, -12.5 - w.x) * push;
              w.xOff = Math.abs(want) > Math.abs(w.xOff || 0) ? want : w.xOff;
            }
          }
          if (w.xOff) { w.xOff *= Math.max(0, 1 - dt * 1.4); if (Math.abs(w.xOff) < 0.01) w.xOff = 0; }
        } else {
          w.x += w.dir * w.s * dt;
          if (w.x > 70 || w.x < -70 || Math.abs(w.x) < 14.2) w.dir *= -1;
        }
      }
      const ry = w.idle ? (w.idleRy !== undefined ? w.idleRy : (w.dir > 0 ? 0.9 : -2.2)) + Math.sin(t * 0.4 + w.ph) * (w.idleRy !== undefined ? 0.06 : 0.14)
        : w.axis === 'z' ? (w.dir > 0 ? 0 : Math.PI) : (w.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
      placePerson(w, peopleMeshes[w.v], w.x + (w.xOff || 0), w.y0 || 0, w.z, ry, bob, sway, w.scale);
    }
    const canWalk = walkWindow(simT);
    for (const c of crossers) {
      const wob = Math.sin(t * 5.2 + c.ph);
      let bob = 0, ry = c.side > 0 ? -Math.PI / 2 : Math.PI / 2;
      if (c.state === 'wait') {
        bob = Math.abs(Math.sin(t * 1.9 + c.ph)) * 0.018;
        if (canWalk) { c.delay -= dt; if (c.delay <= 0) c.state = 'cross'; }
      } else if (c.state === 'cross') {
        bob = Math.abs(wob) * 0.05;
        c.x += -c.side * c.s * 1.35 * dt;
        if (c.x * c.side < -8.4) { c.side = -c.side; c.state = 'away'; }
      } else {
        const south = !MOBILE && c.side < 0;      // west-away walkers head south, clear of the lateral camera
        bob = Math.abs(wob) * 0.05; ry = south ? Math.PI : 0;
        c.z += (south ? -1 : 1) * c.s * 1.2 * dt;
        if (c.z > 95 || c.z < -6) {
          c.state = 'wait'; c.side = R() < 0.5 ? 1 : -1;
          c.x = c.side * rr(8.2, 9.7); c.z = XWALK_Z + rr(-1.8, 2.0);
          c.delay = rr(0, 3.2);
        }
      }
      placePerson(c, peopleMeshes[c.v], c.x, 0, c.z, ry, bob, reduceMotion ? 0 : wob * 0.05, c.scale);
    }
    peopleMeshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });
    screens.instanceMatrix.needsUpdate = true;
    for (const d of dogs) {
      const o = d.owner;
      const wob = Math.sin(t * 8 + o.ph);
      D3.position.set(o.x + (o.xOff || 0) + 0.55, Math.abs(wob) * 0.03, o.z + o.dir * -0.9);
      D3.rotation.set(0, o.dir > 0 ? 0 : Math.PI, 0);
      D3.scale.setScalar(1);
      D3.updateMatrix();
      d.mesh.setMatrixAt(d.slot, D3.matrix);
    }
    if (dogs.length) { dogs[0].mesh.instanceMatrix.needsUpdate = true; }
  }

  /* ---- birds / planes / clouds ---- */
  const amb = reduceMotion ? 0.3 : 1;
  for (let i = 0; i < birds.length; i++) {
    const b = birds[i], f = b.f;
    b.a += f.w * amb * dt;
    const r = f.r + b.ro + Math.sin(t * 0.5 + b.fp) * 6;
    const x = f.cx + Math.cos(b.a) * r, z = f.cz + Math.sin(b.a) * r;
    const y = f.cy + b.yo + Math.sin(t * 0.8 + b.fp) * 3;
    const flap = Math.sin(t * b.fs + b.fp);
    D3.position.set(x, y, z);
    D3.rotation.set(0, -b.a + (f.w > 0 ? 0 : Math.PI), 0);
    D3.scale.set(b.sc, b.sc * flap, b.sc);
    D3.updateMatrix();
    birdMesh.setMatrixAt(i, D3.matrix);
  }
  birdMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < planes.length; i++) {
    const pl = planes[i];
    pl.t += pl.s * amb * dt;
    if (pl.t > 700) pl.t = -700;
    D3.position.set(pl.ox + pl.hx * pl.t, pl.oy, pl.oz + pl.hz * pl.t);
    D3.rotation.set(0, Math.atan2(pl.hx, pl.hz), 0);
    D3.scale.setScalar(0.62);
    D3.updateMatrix();
    planeMesh.setMatrixAt(i, D3.matrix);
  }
  planeMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < mistLayers.length; i++) {              // the shroud thins as we descend into it
    const m = mistLayers[i];
    m.material.opacity = m.userData.o * (1 - sstep(p, 0.16, 0.4)) * (introDone ? 1 : lerp(1.15, 1, sstep(introT, 0.2, 1.8)));
    m.position.x = Math.sin(t * 0.03 + i * 2.1) * 34;
    m.position.z = -30 + Math.cos(t * 0.024 + i * 1.3) * 26;
  }
  for (const cl of clouds) {
    cl.x += cl.drift * amb * dt;
    if (cl.x > 900) cl.x = -900;
    D3.position.set(cl.x, cl.y, cl.z);
    D3.rotation.set(0, cl.ry, 0);
    D3.scale.setScalar(cl.sc);
    D3.updateMatrix();
    cloudMeshes[cl.vi].setMatrixAt(cl.slot, D3.matrix);
  }
  cloudMeshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });

  if (blobMesh && peopleActive) {
    for (const b of blobs) {
      const r = b.ref;
      if (b.kind === 'p') { D3.position.set(r.x + (r.xOff || 0), (r.y0 || 0) + 0.03, r.z); D3.scale.set(0.42 * (r.scale || 1), 1, 0.42 * (r.scale || 1)); }
      else if (b.kind === 'd') { D3.position.set(r.owner.x + 0.55, 0.03, r.owner.z - 0.9); D3.scale.set(0.3, 1, 0.3); }
      else if (b.kind === 'c') { D3.position.set(r.ln.ox + r.ln.dx * r.s + r.ln.px * r.off, 0.04, r.ln.oz + r.ln.dz * r.s + r.ln.pz * r.off); D3.scale.set(1.15, 1, carLen[r.v] * 0.5 * 0.55); }
      else { D3.position.set(r.x, 0.04, r.z); D3.scale.set(1.15, 1, carLen[r.v] * 0.5 * 0.55); if (Math.abs(Math.sin(r.ry || 0)) > 0.5) D3.scale.set(carLen[r.v] * 0.5 * 0.55, 1, 1.15); }
      D3.rotation.set(0, 0, 0); D3.updateMatrix();
      blobMesh.setMatrixAt(b.slot, D3.matrix);
    }
    blobMesh.instanceMatrix.needsUpdate = true;
  }

  hud.fill.style.height = (prog * 100).toFixed(2) + '%';

  /* ---- dynamic resolution ---- */
  fpsEMA = lerp(fpsEMA, 1 / Math.max(dt, 1e-4), 0.05);
  drsCooldown -= dt;
  if (drsCooldown <= 0 && frame > 90) {
    if (fpsEMA < 44 && drsScale > 0.6) { drsScale -= 0.1; renderer.setPixelRatio(BASE_DPR * drsScale); drsCooldown = 1.6; }
    else if (fpsEMA > 57 && drsScale < 1) { drsScale += 0.05; renderer.setPixelRatio(BASE_DPR * drsScale); drsCooldown = 1.6; }
  }

  renderer.render(scene, camera);
  lastInfo = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
  if (hud.debug.style.display === 'block')
    hud.debug.textContent = `tier ${tier}  p ${p.toFixed(3)}\ncalls ${lastInfo.calls}  tris ${(lastInfo.tris / 1000).toFixed(0)}k\nfps ${fpsEMA.toFixed(0)}  dpr ${(BASE_DPR * drsScale).toFixed(2)}`;

  if (frame === 2) { hud.intro.style.opacity = '0'; window.__firstFrame = true; }
}
renderer.setAnimationLoop(tick);

/* ---------------- housekeeping ---------------- */
let resizeRaf = 0;
function onResize() {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    target = clamp(scrollY / maxScroll(), 0, 1);
  });
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 300));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) renderer.setAnimationLoop(null);
  else { clock.getDelta(); renderer.setAnimationLoop(tick); }
});
addEventListener('pagehide', () => { renderer.setAnimationLoop(null); renderer.dispose(); });

window.__errs = [];
addEventListener('error', e => window.__errs.push(String(e.message)));
window.__audit = () => ({ tier, calls: lastInfo.calls, tris: lastInfo.tris, fps: Math.round(fpsEMA), instances: inst.length, progress: prog, errs: window.__errs });
</script>
<noscript><div style="position:fixed;inset:0;background:#fff;padding:20vh 12vw;text-align:center;color:#55595e;font-family:system-ui">This experience needs JavaScript.</div></noscript>
</body>
